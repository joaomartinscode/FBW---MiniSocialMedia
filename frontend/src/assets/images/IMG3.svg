<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1a1f2e"/>
            <stop offset="50%" stop-color="#232a3f"/>
            <stop offset="100%" stop-color="#1b2433"/>
        </linearGradient>

        <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7aa6c2"/>
            <stop offset="50%" stop-color="#b7a3c9"/>
            <stop offset="100%" stop-color="#a7c4a0"/>
        </linearGradient>

        <linearGradient id="lineB" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#c2b280"/>
            <stop offset="50%" stop-color="#8fb3c7"/>
            <stop offset="100%" stop-color="#b39bc8"/>
        </linearGradient>

        <filter id="softGlow">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="800" height="400" fill="url(#bg)"/>

    <circle cx="140" cy="110" r="85" fill="#2d3b4f" opacity="0.35"/>
    <circle cx="680" cy="120" r="110" fill="#3a2f4a" opacity="0.28"/>
    <circle cx="620" cy="320" r="95" fill="#2f4a3d" opacity="0.25"/>

    <path d="M0 210 C140 110, 260 310, 400 210 C540 110, 660 310, 800 210"
          stroke="url(#lineA)" stroke-width="6" fill="none" opacity="0.85" filter="url(#softGlow)"/>

    <path d="M0 250 C160 170, 260 340, 420 250 C580 170, 660 340, 800 250"
          stroke="url(#lineB)" stroke-width="5" fill="none" opacity="0.75" filter="url(#softGlow)"/>

    <polygon points="430,85 480,155 380,155" fill="#c7c3b0" opacity="0.7"/>
    <polygon points="120,310 175,365 65,365" fill="#9fb3c8" opacity="0.65"/>
    <polygon points="690,270 750,350 630,350" fill="#b8a7c9" opacity="0.6"/>

    <circle cx="420" cy="200" r="75" fill="none" stroke="#cfd6df" stroke-width="2" opacity="0.5"/>
    <circle cx="420" cy="200" r="45" fill="#3b4a5c" opacity="0.6"/>

    <path d="M80 90 L150 50 L210 100 L160 150 Z" fill="#c46b6b" opacity="0.45"/>
    <path d="M580 70 L650 30 L710 80 L660 130 Z" fill="#6ba88f" opacity="0.45"/>

    <path d="M60 340 C140 290, 200 380, 280 330 C360 280, 420 380, 500 330"
          stroke="#a7c4a0" stroke-width="4" fill="none" opacity="0.6"/>

    <path d="M320 340 C400 290, 460 380, 540 330 C620 280, 680 380, 760 330"
          stroke="#7aa6c2" stroke-width="4" fill="none" opacity="0.6"/>

    <path d="M110 160 C180 120, 220 200, 290 160 C360 120, 400 200, 470 160"
          stroke="#b7a3c9" stroke-width="3" fill="none" opacity="0.5"/>

    <path d="M330 120 C380 80, 440 160, 500 120 C560 80, 620 160, 680 120"
          stroke="#c2b280" stroke-width="3" fill="none" opacity="0.5"/>
</svg>